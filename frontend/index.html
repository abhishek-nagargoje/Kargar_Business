<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js: GA4 + Google Ads) is loaded once by initGoogleTag() in
         src/lib/analytics.ts, called from src/main.tsx — not here, so the prerender step can't
         bake the injected <script> into static HTML and cause a second load on hydration. -->
    <!-- Ahrefs Analytics -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="RFryIgaRDBhk8k1IPrt+gA" async></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="google-site-verification" content="google52b4520149821fa9" />
    <meta name="facebook-domain-verification" content="7yekn19f78tyoyufv9yi5s9uqfgbsc" />
    <!-- <meta name="msvalidate.01" content="" /> Bing verification — add token when Bing Webmaster Tools is set up -->

    <!-- description/robots/og:*/twitter:* are intentionally NOT duplicated here.
         SEO.tsx (react-helmet-async) renders the real per-page values for all of these on
         every route, and scripts/seo/prerender.ts bakes the post-hydration HTML into the
         static file Vercel serves — so crawlers always see the final, correct tags. A static
         fallback here would only produce duplicate/conflicting tags (e.g. index,follow here
         vs. noindex on /404 or /admin) in the exact same document. -->

    <!-- Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/images/brand/kargar-logo.png" />
    <link rel="apple-touch-icon" href="/images/brand/kargar-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <title>KARGAR Facility Management — India's Trusted FM Partner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
