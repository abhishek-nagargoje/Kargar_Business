name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - Lint, Type Check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint Code
        run: npm run lint

      - name: Build Application
        run: npm run build

      # Crawls the built site through the same vercel.json routing Vercel uses and fails on
      # critical SEO regressions: missing title/description/canonical/H1, noindex or non-200
      # sitemap URLs, broken internal links, canonical pointing at a non-200 URL.
      - name: SEO Regression Audit
        run: npm run seo:audit -- --strict --out ../seo-audit-ci
