        - heading "Website Privacy Policy" [level=1] [ref=f2e60]
        - paragraph [ref=f2e61]: At KARGAR Facility Management, we value your privacy and are committed to protecting any personal or organizational information you share with us when using our website or requesting facility management services.
      - generic [ref=f2e62]:
        - generic [ref=f2e63]:
          - heading "1. Information We Collect" [level=2] [ref=f2e64]
          - paragraph [ref=f2e65]: "When you visit our website, interact with our services, or submit enquiries, we collect information necessary to respond to requests and deliver business services. This includes:"
          - list [ref=f2e66]:
            - listitem [ref=f2e67]:
              - strong [ref=f2e68]: "Contact & Proposal Requests:"
              - text: Full name, business email address, phone number, company name, subject, service interest, and any message content submitted through our online forms.
            - listitem [ref=f2e69]:
              - strong [ref=f2e70]: "Technical & Analytics Data:"
              - text: IP address, browser type, device details, and site usage metrics collected automatically to improve performance and user experience.
        - generic [ref=f2e71]:
          - heading "2. How We Use Your Information" [level=2] [ref=f2e72]
          - paragraph [ref=f2e73]: "The information collected on this website is used solely for legitimate business purposes:"
          - list [ref=f2e74]:
            - listitem [ref=f2e75]: To respond to your inquiries, service requests, and proposal submissions.
            - listitem [ref=f2e76]: To coordinate integrated facility management, housekeeping, security, and maintenance operations.
            - listitem [ref=f2e77]: To communicate relevant project updates, operational notices, or support responses.
            - listitem [ref=f2e78]: To ensure site security, prevent fraud, and maintain compliance with technical standards.
        - generic [ref=f2e79]:
          - heading "3. Data Protection & Security" [level=2] [ref=f2e80]
          - paragraph [ref=f2e81]: We implement technical and organizational measures to safeguard your information against unauthorized access, alteration, disclosure, or destruction. Access to personal and corporate data is restricted to authorized personnel who require it to perform operational duties.
        - generic [ref=f2e82]:
          - heading "4. Cookies & Web Analytics" [level=2] [ref=f2e83]
          - paragraph [ref=f2e84]: Our website uses standard browser cookies and analytics software to enhance navigation, analyze aggregate visitor behavior, and optimize service delivery. You can configure your browser to decline cookies, though some features of the site may function with limited capabilities.
        - generic [ref=f2e85]:
          - heading "5. Third-Party Sharing" [level=2] [ref=f2e86]
          - paragraph [ref=f2e87]: We do not sell, rent, or trade your personal information to third parties. Information may only be disclosed if required by applicable legal obligations, regulatory mandates, or to essential technology partners who assist in operating our secure infrastructure.
